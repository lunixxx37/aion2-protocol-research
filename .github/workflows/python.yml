name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python tools/aion2_client_crypto.py --self-test
      - run: python tools/generate_opcode_docs.py --check
      - run: python -m compileall -q tools
